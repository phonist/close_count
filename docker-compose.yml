services:

  client:
    container_name: close-count-client
    hostname: close-count-client
    build: 
      context: ./client
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    networks:
      - mern-network
    volumes:
      - ./client:/usr/app
      - /usr/app/node_modules
    depends_on:
      - server
    environment:
      - REACT_APP_SERVER=http://localhost:8005
      - REACT_APP_HOST=localhost
      - REACT_APP_API_URL=http://localhost:8005/api
      - CHOKIDAR_USEPOLLING=true
    command: yarn start
    stdin_open: true
    tty: true
  
  server:
    container_name: close-count-server
    hostname: close-count-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - 8005:8005
    networks:
      - mern-network
    volumes:
      - ./server:/usr/app
      - /usr/app/node_modules
    depends_on:
      - db
    environment:
      - MONGO_URI=mongodb://close-count-mongodb:27017/closecount
      - CLIENT_URL=http://localhost:3000
      - CLIENT=http://localhost:3000
      - PORT=8005
      - ENVIRONMENT=development
      - NODE_ENV=development
      # WARNING: Change JWT_SECRET in production! Use .env file for secrets
      - JWT_SECRET=${JWT_SECRET:-closecounttoken-dev-only}
      - JWT_EXPIRE=5 days
    command: yarn server
    # command: /usr/app/node_modules/.bin/nodemon -L src/index.js

  db:
    container_name: close-count-mongodb
    hostname: close-count-mongodb
    image: mongo
    ports:
      - 27017:27017
    networks:
      - mern-network
    volumes:
      - mongo-data:/data/db

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
