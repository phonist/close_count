apiVersion: apps/v1
kind: Deployment
metadata:
  name: closecount-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: closecount-client
  template:
    metadata:
      labels:
        app: closecount-client
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: close-count-client
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # CRA can take a while to compile on startup; avoid liveness killing it before it begins serving.
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60 # 5 minutes
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: REACT_APP_SERVER
              value: http://closecount.local
            - name: REACT_APP_HOST
              value: http://closecount.local
            - name: REACT_APP_API_URL
              value: https://closecount.local/api
