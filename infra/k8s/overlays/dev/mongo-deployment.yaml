apiVersion: apps/v1
kind: Deployment
metadata:
  name: closecount-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: closecount-mongodb
  template:
    metadata:
      labels:
        app: closecount-mongodb
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # The PV uses hostPath in the kind node. Ensure the directory is writable by UID/GID 999
      # (the mongo image user) before mongo starts.
      initContainers:
        - name: init-mongo-permissions
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /data/db && chown -R 999:999 /data/db"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: closecount-mongo-pvc
