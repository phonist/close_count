apiVersion: apps/v1
kind: Deployment
metadata:
  name: closecount-server
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: CLIENT_URL
              value: http://closecount.local
            - name: CLIENT
              value: http://closecount.local
            - name: ENVIRONMENT
              value: development
            - name: NODE_ENV
              value: development
