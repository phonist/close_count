apiVersion: apps/v1
kind: Deployment
metadata:
  name: closecount-server
spec:
  template:
    spec:
      containers:
        - name: server
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8005
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60  # 5 minutes
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
